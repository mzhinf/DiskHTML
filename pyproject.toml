[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "diskhtml"
version = "0.1.0"
description = "Windows 文件 Hash 冷备份校验工具"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.12,<0.13"]

[project.scripts]
diskhtml = "diskhtml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
branch = true
source = ["diskhtml"]

[tool.coverage.report]
show_missing = true
skip_covered = true

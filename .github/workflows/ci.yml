# 校验一方源码质量；Windows 发布包仅由受控本地发布流程生成。
name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: cmd

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Create project virtual environment
        run: python -m venv .venv

      - name: Install development dependencies
        run: .venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Check formatting
        run: .venv\Scripts\python.exe -m ruff format --check src scripts tests

      - name: Run static checks
        run: .venv\Scripts\python.exe -m ruff check src scripts tests

      - name: Run tests
        run: .venv\Scripts\python.exe -m unittest discover -s tests -p "test_*.py"
